server {
    listen 80 default_server;
    server_name 13-125-50-220.sslip.io 13.125.50.220 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://13-125-50-220.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 13-125-50-220.sslip.io;

    ssl_certificate /etc/letsencrypt/live/13-125-50-220.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13-125-50-220.sslip.io/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;

    location /api/ {
        set $backend "backend";
        proxy_pass http://$backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $frontend "frontend";
        proxy_pass http://$frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
