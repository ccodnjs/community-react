name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and build backend jar
        run: ./gradlew clean test bootJar --no-daemon

  frontend-ci:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Test frontend
        run: pnpm test

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    steps:
      - name: Check required secrets
        run: |
          : "${EC2_HOST:?Missing EC2_HOST secret}"
          : "${EC2_USER:?Missing EC2_USER secret}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"
          : "${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD secret}"
          : "${MYSQL_DATABASE:?Missing MYSQL_DATABASE secret}"
          : "${MYSQL_USER:?Missing MYSQL_USER secret}"
          : "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD secret}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/community-key.pem
          chmod 600 ~/.ssh/community-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          cat > community.env << ENVEOF
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          MYSQL_DATABASE=$MYSQL_DATABASE
          MYSQL_USER=$MYSQL_USER
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          ENVEOF

          scp -i ~/.ssh/community-key.pem community.env "$EC2_USER@$EC2_HOST:/tmp/community.env"

          ssh -i ~/.ssh/community-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            if [ ! -d "$HOME/community-react/.git" ]; then
              git clone https://github.com/ccodnjs/community-react.git "$HOME/community-react"
            fi

            cd "$HOME/community-react"
            git fetch origin main
            git reset --hard origin/main

            mv /tmp/community.env .env
            chmod 600 .env

            sudo docker compose version
            sudo docker compose pull mysql nginx || true
            sudo docker compose up -d --build mysql backend frontend nginx
            sudo docker compose ps
          EOF
