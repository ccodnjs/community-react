name: CI/CD Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend jar
        run: ./gradlew clean bootJar --no-daemon

  frontend-ci:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/community-key.pem
          chmod 600 ~/.ssh/community-key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/community-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            if [ ! -d "$HOME/community-react/.git" ]; then
              git clone https://github.com/ccodnjs/community-react.git "$HOME/community-react"
            fi

            cd "$HOME/community-react"
            git fetch origin main
            git reset --hard origin/main

            printf '%s\n' \
              "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" \
              "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" \
              "MYSQL_USER=${{ secrets.MYSQL_USER }}" \
              "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" \
              > .env

            sudo docker compose pull mysql nginx || true
            sudo docker compose up -d --build mysql backend frontend nginx
            sudo docker compose ps
          EOF
